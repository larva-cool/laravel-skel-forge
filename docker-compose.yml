name: app-forge

x-app-build: &app-build
  context: .
  args:
    ENV: ${ENV:-prod}

x-app-environment: &app-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?请先在 .env 中设置 APP_KEY}
  APP_URL: ${APP_URL:-http://localhost:9501}
  LOG_CHANNEL: stack
  OCTANE_HTTPS: "false"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${MYSQL_DATABASE:-forge}
  DB_USERNAME: ${MYSQL_USER:-forge}
  DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: null
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID:-forge}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-forge-key}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-forge-secret}
  REVERB_HOST: reverb
  REVERB_PORT: 9502
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: 9502

x-app-volumes: &app-volumes
  - app_storage:/app/storage/app
  - app_logs:/app/storage/logs

x-app-common: &app-common
  env_file:
    - .env
  environment: *app-environment
  volumes: *app-volumes
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *app-common
    build:
      <<: *app-build
      target: api
    ports:
      - "${APP_PORT:-9501}:9501"

  worker:
    <<: *app-common
    build:
      <<: *app-build
      target: worker

  scheduler:
    <<: *app-common
    build:
      <<: *app-build
      target: scheduler

  reverb:
    <<: *app-common
    build:
      <<: *app-build
      target: reverb
    ports:
      - "${REVERB_EXTERNAL_PORT:-9502}:9502"

  pulse:
    <<: *app-common
    build:
      <<: *app-build
      target: pulse

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-forge}
      MYSQL_USER: ${MYSQL_USER:-forge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  app_storage:
  app_logs:
  mysql_data:
  redis_data:
